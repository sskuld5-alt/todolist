<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 폰트 설정 -->
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: Pretendard, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e5e7eb; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 아이콘 컴포넌트들 (Lucide Icons SVG)
        const Plus = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const Trash2 = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );
        const Check = ({ size = 24, className = "", strokeWidth = 2 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        const LayoutList = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="14" width="7" height="7"></rect><rect x="3" y="3" width="7" height="7"></rect><line x1="14" y1="4" x2="21" y2="4"></line><line x1="14" y1="9" x2="21" y2="9"></line><line x1="14" y1="15" x2="21" y2="15"></line><line x1="14" y1="20" x2="21" y2="20"></line></svg>
        );
        const Calendar = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        );

        function App() {
            const [todos, setTodos] = useState([
                { id: 1, text: '리액트 공부하기', completed: true },
                { id: 2, text: '운동 가기', completed: false },
                { id: 3, text: '책 읽기', completed: false },
            ]);
            const [inputValue, setInputValue] = useState('');

            // 할 일 추가 함수
            const addTodo = () => {
                if (inputValue.trim() === '') return;
                
                const newTodo = {
                    id: Date.now(),
                    text: inputValue,
                    completed: false,
                };

                setTodos([...todos, newTodo]);
                setInputValue('');
            };

            // 엔터키 입력 처리
            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    addTodo();
                }
            };

            // 완료 상태 토글 함수
            const toggleTodo = (id) => {
                setTodos(
                    todos.map((todo) =>
                        todo.id === id ? { ...todo, completed: !todo.completed } : todo
                    )
                );
            };

            // 할 일 삭제 함수
            const deleteTodo = (id) => {
                setTodos(todos.filter((todo) => todo.id !== id));
            };

            // 진행률 계산
            const totalTodos = todos.length;
            const completedTodos = todos.filter((todo) => todo.completed).length;
            const progressPercentage = totalTodos === 0 ? 0 : Math.round((completedTodos / totalTodos) * 100);

            // 날짜 표시
            const today = new Date().toLocaleDateString('ko-KR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
            });

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 text-gray-800">
                    <div className="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                        
                        {/* 헤더 영역 */}
                        <div className="bg-indigo-600 p-6 text-white">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <h1 className="text-2xl font-bold flex items-center gap-2">
                                        <LayoutList size={24} />
                                        할 일 목록
                                    </h1>
                                    <p className="text-indigo-200 text-sm mt-1 flex items-center gap-1">
                                        <Calendar size={14} />
                                        {today}
                                    </p>
                                </div>
                                <div className="text-right">
                                    <span className="text-3xl font-bold">{completedTodos}</span>
                                    <span className="text-indigo-300 text-lg"> / {totalTodos}</span>
                                </div>
                            </div>

                            {/* 진행률 바 */}
                            <div className="mt-4">
                                <div className="flex justify-between text-xs mb-1 text-indigo-100">
                                    <span>진행 상황</span>
                                    <span>{progressPercentage}%</span>
                                </div>
                                <div className="w-full bg-indigo-900/30 rounded-full h-2">
                                    <div
                                        className="bg-white h-2 rounded-full transition-all duration-500 ease-out"
                                        style={{ width: `${progressPercentage}%` }}
                                    ></div>
                                </div>
                            </div>
                        </div>

                        {/* 입력 영역 */}
                        <div className="p-6 pb-4">
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    className="flex-1 bg-gray-100 border-none rounded-xl px-4 py-3 text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all placeholder-gray-400"
                                    placeholder="새로운 할 일을 입력하세요..."
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                />
                                <button
                                    onClick={addTodo}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl transition-colors duration-200 flex items-center justify-center shadow-md active:scale-95"
                                    aria-label="추가"
                                >
                                    <Plus size={24} />
                                </button>
                            </div>
                        </div>

                        {/* 리스트 영역 */}
                        <div className="px-6 pb-6 h-[400px] overflow-y-auto custom-scrollbar">
                            {todos.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400 space-y-3">
                                    <LayoutList size={48} className="opacity-20" />
                                    <p>할 일이 없습니다. <br />새로운 목표를 추가해보세요!</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {todos.map((todo) => (
                                        <div
                                            key={todo.id}
                                            className={`group flex items-center gap-3 p-3 rounded-xl transition-all duration-200 border ${
                                                todo.completed 
                                                ? 'bg-gray-50 border-gray-100' 
                                                : 'bg-white border-gray-200 shadow-sm hover:shadow-md hover:border-indigo-200'
                                            }`}
                                        >
                                            <button
                                                onClick={() => toggleTodo(todo.id)}
                                                className={`flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors duration-200 ${
                                                    todo.completed
                                                    ? 'bg-indigo-500 border-indigo-500 text-white'
                                                    : 'border-gray-300 text-transparent hover:border-indigo-400'
                                                }`}
                                            >
                                                <Check size={14} strokeWidth={3} />
                                            </button>
                                            
                                            <span
                                                onClick={() => toggleTodo(todo.id)}
                                                className={`flex-1 cursor-pointer truncate select-none transition-colors duration-200 ${
                                                    todo.completed
                                                    ? 'text-gray-400 line-through decoration-gray-400'
                                                    : 'text-gray-700'
                                                }`}
                                            >
                                                {todo.text}
                                            </span>

                                            <button
                                                onClick={() => deleteTodo(todo.id)}
                                                className="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-all duration-200 opacity-0 group-hover:opacity-100 focus:opacity-100"
                                                aria-label="삭제"
                                            >
                                                <Trash2 size={18} />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
